# SPDX-License-Identifier: MIT
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_GIC_SAFE_CONFIG=y
CONFIG_MULTITHREADING=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_ARM64_DCACHE_ALL_OPS=y
CONFIG_ARM64_BOOT_DISABLE_DCACHE=y
# The 28 MiB identity-mapped bulk-data window starts at 0x50400000.
# Keep runtime device_map() allocations above that window instead of
# exhausting the original 8 MiB kernel virtual-address arena.
CONFIG_KERNEL_VM_SIZE=0x04000000
